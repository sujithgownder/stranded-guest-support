[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stranded-guest-support"
version = "0.1.0"
description = "Stranded guest support"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
stranded-guest = "stranded_guest_support.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
